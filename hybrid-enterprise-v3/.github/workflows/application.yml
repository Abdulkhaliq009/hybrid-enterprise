name: Application CI/CD — DevSecOps

on:
  push:
    branches: [main]
    paths: ["app/**", "helm/**"]
  pull_request:
    branches: [main]
    paths: ["app/**", "helm/**"]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  quality-gates:
    name: Tests + lint + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: ESLint
        working-directory: app
        run: npx eslint .

      - name: Helm lint
        run: |
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint helm/hybrid-api

      - name: Docker build
        working-directory: app
        run: docker build -t hybrid-api:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hybrid-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  deploy:
    name: Push ACR + deploy AKS
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build + push image
        working-directory: app
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/hybrid-api:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_NAME }} \
            --overwrite-existing

      - name: Helm deploy
        run: |
          helm upgrade --install hybrid-api ./helm/hybrid-api \
            --set image.repository=${{ secrets.ACR_NAME }}.azurecr.io/hybrid-api \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Smoke test
        run: |
          kubectl rollout status deployment/hybrid-api-api --timeout=120s
          kubectl get pods -l app=hybrid-api-api
