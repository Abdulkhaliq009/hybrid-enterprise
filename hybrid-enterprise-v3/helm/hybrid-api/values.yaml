replicaCount: 2

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  hosts:
    - host: hybrid-api.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  onpremCidr: 192.168.178.0/24

# DB connection sourced from Kubernetes secret (Key Vault CSI or manual)
# kubectl create secret generic hybrid-api-db --from-literal=host=<IP>
# kubectl create secret generic hybrid-api-secrets --from-literal=DB_USER=... --from-literal=DB_PASSWORD=...
env:
  DB_PORT: "1433"
  DB_NAME: "labdb"

secretRef:
  name: hybrid-api-secrets

dbSecretRef:
  name: hybrid-api-db
  hostKey: host
