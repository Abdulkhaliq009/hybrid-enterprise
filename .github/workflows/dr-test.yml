name: DR test (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type FAILOVER to confirm DR test'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  dr-drill:
    name: Disaster recovery drill
    runs-on: ubuntu-latest
    environment: dev
    if: github.event.inputs.confirm == 'FAILOVER'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pre-failover health check
        run: bash tests/disaster-recovery/01-pre-check.sh

      - name: Record start time (RTO measurement)
        run: echo "RTO_START=$(date +%s)" >> $GITHUB_ENV

      - name: Verify backup recovery points exist
        run: bash tests/disaster-recovery/02-verify-recovery-points.sh

      - name: Simulate failover validation
        run: bash tests/disaster-recovery/03-failover-validate.sh

      - name: Report RTO
        run: |
          RTO_END=$(date +%s)
          echo "Drill duration: $(( (RTO_END - RTO_START) / 60 )) minutes (target: 60)"
